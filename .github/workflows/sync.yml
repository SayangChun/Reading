name: Sync Reading List

# 自动化同步：每天北京时间 00:00 拉取读书记录仓库，重新生成 README.md 书单。
# 也支持在 Actions 页面点 "Run workflow" 手动触发。
#
# 数据源 yuedujilu_backup 默认是私有库：
#   - 若已改为 Public，GITHUB_TOKEN 即可读取，无需任何 secret；
#   - 若保持私有，需在 Reading → Settings → Secrets and variables → Actions
#     添加带 repo 权限的 PAT，名称为 SOURCE_TOKEN。
# 源库不可达（私有且未配令牌 / 仓库不存在 / 令牌失效）时，本工作流会跳过同步并保留
# 现有 README，既不报错刷屏，也不会用错误数据覆盖现有书单。
on:
  schedule:
    - cron: "0 16 * * *"        # UTC 16:00 == 北京时间次日 00:00
  workflow_dispatch: {}         # 手动按钮

# 允许工作流把生成的 README 提交回本仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reading（本仓库，含生成器）
        uses: actions/checkout@v4

      - name: Checkout 读书记录（数据源）
        id: source_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: SayangChun/yuedujilu_backup
          path: source
          # 数据源是私有库时需要读令牌；公开库则 GITHUB_TOKEN 即可。
          # 私有库请在 Reading → Settings → Secrets → Actions 里加 SOURCE_TOKEN
          # （一个带 repo 权限的 Personal Access Token）。
          token: ${{ secrets.SOURCE_TOKEN || github.token }}

      - name: 校验数据源是否可用
        id: guard
        run: |
          if [ -f source/data/books.json ] || [ -f source/books.json ] || [ -d source/books ] || [ -d source/data ]; then
            echo "source_ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::数据源检出成功，开始生成书单。"
          else
            echo "source_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未能检出可用的数据源（yuedujilu_backup 可能是私有库且没有配置 SOURCE_TOKEN，或仓库不存在）。本次保留现有 README，不同步，避免覆盖现有内容。请参考 SETUP.md 的「你只需要做一件事」配置访问权限。"
          fi

      - name: Generate README + SHELF（含封面）
        if: steps.guard.outputs.source_ok == 'true'
        continue-on-error: true
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/generate_readme.py --source source --output README.md --covers-dir covers

      - name: Commit & Push
        if: steps.guard.outputs.source_ok == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync reading list (with covers)"
          file_pattern: "README.md SHELF.md covers/"
          commit_user_name: "reading-sync-bot"
          commit_user_email: "reading-sync@users.noreply.github.com"
